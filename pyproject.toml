[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gatescope"
version = "2.0.0a0"
description = "Security-first crypto market research and execution platform"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "mcp>=2.1,<3",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pillow>=11,<13",
  "psycopg[binary,pool]>=3.2,<4",
  "requests[socks]>=2.32,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
gatescope-api = "apps.api.main:main"
market-worker = "apps.market_worker.main:main"
strategy-worker = "apps.strategy_worker.main:main"
notification-worker = "apps.notification_worker.main:main"
paper-worker = "apps.paper_worker.main:main"
chart-worker = "apps.chart_worker.main:main"
executor = "apps.executor.main:main"
mcp-server = "apps.mcp_server.main:main"
gatescope-admin = "gatescope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gatescope", "src/gatescope_executor", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --import-mode=importlib"

[tool.ruff]
target-version = "py310"
line-length = 110
exclude = ["static/vendor", "__MACOSX"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.mypy]
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["migrations", "__MACOSX"]
