apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gatescope-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gatescope-api-ingress
spec:
  podSelector:
    matchLabels:
      gatescope.workload: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-system
      ports:
        - protocol: TCP
          port: 8777
---
# DNS is the only shared egress. Provider-specific egress is added per workload
# after resolving the cluster's FQDN/IP policy mechanism.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gatescope-dns-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

