map $http_upgrade $gatescope_connection_upgrade {
    default upgrade;
    '' close;
}

# Shared across nginx workers. OAuth registration is unauthenticated and bounded.
limit_req_zone $binary_remote_addr zone=gatescope_oauth_registration:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=gatescope_oauth_exchange:1m rate=60r/m;

# Bounded OAuth diagnostics: URI PATH only, never request/query/body/headers,
# raw IP, raw user agent, cookies, codes, state or tokens. User-agent classes
# are hints supplied by clients, NOT proof of OpenAI identity.
map $remote_addr $gatescope_oauth_source {
    default remote;
    127.0.0.1 local;
    ::1 local;
    43.108.44.74 server;
}
map $http_user_agent $gatescope_oauth_agent {
    default other;
    '' absent;
    ~*GateScope-OAuth-Diagnostic diagnostic;
    ~*(ChatGPT|OpenAI) openai_labeled;
    ~*python python;
    ~*curl curl;
    ~*node node;
}
log_format gatescope_oauth_discovery escape=json
    '{"time":"$time_iso8601","method":"$request_method","path":"$uri",'
    '"status":$status,"upstream":"$upstream_status","seconds":$request_time,'
    '"source":"$gatescope_oauth_source","agent":"$gatescope_oauth_agent"}';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 43.108.44.74;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 43.108.44.74;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/43.108.44.74/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43.108.44.74/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:GateScopeTLS:10m;
    ssl_session_tickets off;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Only immutable, content-hashed build assets get a long-lived cache.
    # Credential/auth JSON remains uncompressed. Public OHLC has an explicit
    # exact-path exception below; never enable JSON compression globally.
    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:17758;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        gzip on;
        gzip_types text/css application/javascript text/javascript image/svg+xml;
        gzip_min_length 1024;
        gzip_comp_level 4;
        gzip_vary on;
    }

    location = /api/v2/bars {
        proxy_pass http://127.0.0.1:17758;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Strict-Transport-Security;
        proxy_read_timeout 65s;
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;
        gzip_comp_level 4;
        gzip_vary on;
        gzip_proxied any;
    }

    # Remote MCP is a separate authenticated read plane. Never expose its
    # loopback port or log Authorization headers / request bodies.
    location = /mcp {
        proxy_pass http://127.0.0.1:17800/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header Strict-Transport-Security;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        client_max_body_size 256k;
        access_log /var/log/nginx/gatescope-oauth-discovery.log gatescope_oauth_discovery;
        error_log /dev/null crit;
        gzip off;
    }

    # Normalize only this exact resource alias upstream, preserving POST bodies
    # and the OAuth challenge instead of falling through to the Web login gate.
    location = /mcp/ {
        proxy_pass http://127.0.0.1:17800/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header Strict-Transport-Security;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        client_max_body_size 256k;
        access_log /var/log/nginx/gatescope-oauth-discovery.log gatescope_oauth_discovery;
        error_log /dev/null crit;
        gzip off;
    }

    # Observe exact discovery paths (including unsupported fallback probes).
    # The API alone decides which are supported; do not manufacture OIDC or
    # change issuer/resource identifiers for guessed authorization-server paths.
    location ~ ^/(\.well-known/(oauth-(authorization-server|protected-resource)|openid-configuration)(/mcp)?|mcp/\.well-known/(oauth-authorization-server|oauth-protected-resource|openid-configuration))/?$ {
        proxy_pass http://127.0.0.1:17758;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Strict-Transport-Security;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_cache off;
        access_log /var/log/nginx/gatescope-oauth-discovery.log gatescope_oauth_discovery;
        error_log /dev/null crit;
        gzip off;
    }

    location = /oauth/register {
        limit_req zone=gatescope_oauth_registration burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @gatescope_oauth_limited;
        proxy_pass http://127.0.0.1:17758;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Strict-Transport-Security;
        client_max_body_size 16k;
        access_log /var/log/nginx/gatescope-oauth-discovery.log gatescope_oauth_discovery;
        error_log /dev/null crit;
        gzip off;
        proxy_cache off;
    }

    # Only path/status/timing classes are logged, never OAuth payloads.
    location ~ ^/(oauth/(authorize|token|revoke)|integrations/mcp/authorize|api/v2/mcp/oauth/consent)$ {
        limit_req zone=gatescope_oauth_exchange burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @gatescope_oauth_limited;
        proxy_pass http://127.0.0.1:17758;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Strict-Transport-Security;
        client_max_body_size 16k;
        access_log /var/log/nginx/gatescope-oauth-discovery.log gatescope_oauth_discovery;
        error_log /dev/null crit;
        gzip off;
        proxy_cache off;
        proxy_buffering off;
    }

    location @gatescope_oauth_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Cache-Control no-store always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log /var/log/nginx/gatescope-oauth-discovery.log gatescope_oauth_discovery;
        return 429 '{"error":"temporarily_unavailable","error_description":"Please retry later"}';
    }

    location / {
        proxy_pass http://127.0.0.1:17758;
        proxy_http_version 1.1;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gatescope_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}
