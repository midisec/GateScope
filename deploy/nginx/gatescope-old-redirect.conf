# Temporary entry point on the retired server; no application proxy remains.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 43.155.154.25;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 444; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 43.155.154.25;
    server_tokens off;
    access_log off;
    ssl_certificate /etc/letsencrypt/live/43.155.154.25/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43.155.154.25/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Do not redirect or replay an old POST / order / login submission.
    if ($request_method !~ ^(GET|HEAD)$) { return 503; }
    return 302 https://43.108.44.74$request_uri;
}
