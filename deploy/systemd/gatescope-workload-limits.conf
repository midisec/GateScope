[Unit]
After=postgresql@14-main.service
StartLimitIntervalSec=300
StartLimitBurst=30

[Service]
Slice=gatescope.slice
MemoryAccounting=true
MemoryHigh=512M
MemoryMax=768M
MemorySwapMax=256M
TasksMax=128
OOMScoreAdjust=300
RestartSec=10
Environment=OPENBLAS_NUM_THREADS=1
Environment=OMP_NUM_THREADS=1
Environment=MKL_NUM_THREADS=1
