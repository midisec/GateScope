# Optional API service drop-in, not a standalone unit and not enabled by default.
# Replace the example tunnel ID with the ONE tunnel serving this MCP resource.
# Install as /etc/systemd/system/gatescope-api.service.d/oauth-tunnel-resource.conf
# This URI is an exact logical resource alias, never an outbound HTTP target.
[Service]
Environment="GATESCOPE_MCP_OAUTH_TUNNEL_RESOURCE=https://tunnel-service.gateway.unified-0.internal.api.openai.org/v1/mcp/tunnel_0123456789abcdef0123456789abcdef"
