# OPTIONAL operator-installed drop-in for gatescope-market.service.d/,
# gatescope-strategy.service.d/ and gatescope-research.service.d/ ONLY.
# The market worker must include its historical-backfill storage guard first.
# This does not pause live pattern tracking,
# live alert evaluation, market candles, notifications or PAPER protection.
# Existing low-space admission thresholds remain in place. Regaining free disk
# must not itself resume a full replay. An operator removes this hold only after
# reviewing space headroom and historical work budgets. Never auto-restart from
# a storage probe: normal controlled deployment must allow checkpoints to commit.
[Service]
Environment=GATESCOPE_HISTORY_TASKS_ENABLED=false
