# Install on gatescope-strategy.service.d/ and gatescope-research.service.d/.
# This deployment's application, PG data and pg_wal are on the verified root mount.
# Use separately verified, readable mount roots here if the database moves disks.
# Do not point an unprivileged service at PostgreSQL's private data directory.
[Service]
Environment=GATESCOPE_HISTORY_STORAGE_PATHS=/
